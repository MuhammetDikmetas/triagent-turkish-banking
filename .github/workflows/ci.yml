name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Build data & train
        run: |
          python scripts/build_dataset.py
          python scripts/train.py
      - name: Tests
        run: pytest -q
      - name: Offline evaluation (regression check)
        env:
          LLM_PROVIDER: none
        run: python eval/run_eval.py